name: Deploy Coconut web

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: coconut-pages
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download the release-built web archive
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          mkdir archive site
          gh release download "$RELEASE_TAG" --pattern 'coconut-web-*.zip' --dir archive
          gh release download "$RELEASE_TAG" --pattern 'SHA256SUMS.txt' --dir archive
          archives=(archive/*.zip)
          test "${#archives[@]}" -eq 1
          python3 - <<'PY'
          import hashlib, pathlib, re, stat, zipfile
          archive, = pathlib.Path("archive").glob("*.zip")
          expected = [line.split()[0] for line in pathlib.Path("archive/SHA256SUMS.txt").read_text().splitlines()
                      if re.fullmatch(r"[0-9a-f]{64}  " + re.escape(archive.name), line)]
          if expected != [hashlib.sha256(archive.read_bytes()).hexdigest()]:
              raise SystemExit("Release archive checksum mismatch")
          with zipfile.ZipFile(archive) as bundle:
              if sum(entry.file_size for entry in bundle.infolist()) > 250_000_000:
                  raise SystemExit("Unexpectedly large web archive")
              for entry in bundle.infolist():
                  path = pathlib.PurePosixPath(entry.filename)
                  if path.is_absolute() or ".." in path.parts or stat.S_ISLNK(entry.external_attr >> 16):
                      raise SystemExit("Unsafe archive entry")
              bundle.extractall("site")
          PY
          test -f site/index.html
          test -f site/404.html
          test "$(cat site/CNAME)" = "coconut.seedworkslab.de"
          test -f site/.nojekyll
          grep -q '/_expo/' site/index.html
          if grep -q '/apps/coconut/web/' site/index.html; then
            echo "Refusing an old path-based release bundle." >&2
            exit 1
          fi
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: site
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
